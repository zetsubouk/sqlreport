name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装项目（可编辑模式）
        run: pip install -e .
      - name: 语法编译检查
        run: python3 -m py_compile src/sqlreport/*.py
      - name: 模块导入冒烟
        run: python3 -c "import sqlreport.server, sqlreport.db, sqlreport.params; print('import ok')"
      - name: 单元测试（零依赖 unittest）
        run: python3 -m unittest discover -s tests -v
      - name: 服务启动 + 首页冒烟
        run: |
          python3 server.py > /tmp/srv.log 2>&1 &
          SRV=$!
          sleep 2
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8765/ || true)
          kill $SRV 2>/dev/null || true
          if [ "$code" != "200" ]; then cat /tmp/srv.log; exit 1; fi
          echo "HTTP $code OK"
